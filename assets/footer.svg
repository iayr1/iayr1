<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0891B2"/><stop offset="0.5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#E8EDF7" stroke-width="1" opacity="0.8"/>
  </pattern>
  <radialGradient id="glowc" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0891B2" stop-opacity="0.12"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowv" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7C3AED" stop-opacity="0.12"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E2A55" flood-opacity="0.07"/></filter>
  <clipPath id="frame"><rect width="1200" height="120" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  
</style>
<rect width="1200" height="120" rx="18" fill="url(#bg)"/>
<rect width="1200" height="120" rx="18" fill="url(#grid)"/>
<g clip-path="url(#frame)"><text x="600" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Let us build intelligent systems together.</text><text x="600" y="84" text-anchor="middle" class="mono" font-size="13" letter-spacing="1" fill="#5B6680">mayurailead@gmail.com</text><rect x="0" y="116" width="1200" height="4" fill="url(#accent)"/></g>
<rect x="0.5" y="0.5" width="1199" height="119" rx="18" fill="none" stroke="#E3E8F2"/>
</svg>
