<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B18"/><stop offset="1" stop-color="#0E1530"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#121B3A"/><stop offset="1" stop-color="#0F1630"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#18224A" stroke-width="1" opacity="0.55"/>
  </pattern>
  <radialGradient id="glowc" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowv" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="frame"><rect width="1200" height="230" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  
</style>
<rect width="1200" height="230" rx="18" fill="url(#bg)"/>
<rect width="1200" height="230" rx="18" fill="url(#grid)"/>
<g clip-path="url(#frame)"><text x="48" y="34" class="mono" font-size="13" letter-spacing="3" fill="#22D3EE">PROFILE</text><text x="48" y="68" font-size="28" font-weight="700" fill="#E8EEF9">At a glance</text><rect x="48" y="82" width="56" height="3" rx="1.5" fill="url(#accent)"/><text x="1152" y="56" text-anchor="end" font-size="15" fill="#8C98B8"><tspan fill="#E8EEF9" font-weight="600">EDGE</tspan>  /  Mumbai, India</text><g transform="translate(48,96)"><rect width="258" height="96" rx="14" fill="url(#cardg)" stroke="#1F2A4D"/><rect x="0" y="0" width="4" height="96" rx="2" fill="url(#accent)"/><text x="24" y="50" font-size="34" font-weight="800" fill="#E8EEF9">6+</text><text x="24" y="76" font-size="14" fill="#8C98B8">Years building software</text></g><g transform="translate(328,96)"><rect width="258" height="96" rx="14" fill="url(#cardg)" stroke="#1F2A4D"/><rect x="0" y="0" width="4" height="96" rx="2" fill="url(#accent)"/><text x="24" y="50" font-size="34" font-weight="800" fill="#E8EEF9">3</text><text x="24" y="76" font-size="14" fill="#8C98B8">Companies, AI to FinTech</text></g><g transform="translate(608,96)"><rect width="258" height="96" rx="14" fill="url(#cardg)" stroke="#1F2A4D"/><rect x="0" y="0" width="4" height="96" rx="2" fill="url(#accent)"/><text x="24" y="50" font-size="34" font-weight="800" fill="#E8EEF9">2</text><text x="24" y="76" font-size="14" fill="#8C98B8">CRM platforms automated</text></g><g transform="translate(888,96)"><rect width="258" height="96" rx="14" fill="url(#cardg)" stroke="#1F2A4D"/><rect x="0" y="0" width="4" height="96" rx="2" fill="url(#accent)"/><text x="24" y="50" font-size="34" font-weight="800" fill="#E8EEF9">M.Sc.</text><text x="24" y="76" font-size="14" fill="#8C98B8">Data Science</text></g></g>
<rect x="0.5" y="0.5" width="1199" height="229" rx="18" fill="none" stroke="#1F2A4D"/>
