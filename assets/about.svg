<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0891B2"/><stop offset="0.5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#E8EDF7" stroke-width="1" opacity="0.8"/>
  </pattern>
  <radialGradient id="glowc" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0891B2" stop-opacity="0.12"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowv" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7C3AED" stop-opacity="0.12"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E2A55" flood-opacity="0.07"/></filter>
  <clipPath id="frame"><rect width="1200" height="230" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  
</style>
<rect width="1200" height="230" rx="18" fill="url(#bg)"/>
<rect width="1200" height="230" rx="18" fill="url(#grid)"/>
<g clip-path="url(#frame)"><text x="48" y="34" class="mono" font-size="13" letter-spacing="3" fill="#0891B2">PROFILE</text><text x="48" y="68" font-size="28" font-weight="700" fill="#0F172A">At a glance</text><rect x="48" y="82" width="56" height="3" rx="1.5" fill="url(#accent)"/><text x="1152" y="56" text-anchor="end" font-size="15" fill="#5B6680"><tspan fill="#0F172A" font-weight="600">EDGE</tspan>  /  Mumbai, India</text><g transform="translate(48,96)"><rect width="258" height="96" rx="14" fill="url(#cardg)" stroke="#E3E8F2" filter="url(#sh)"/><rect x="0" y="0" width="4" height="96" rx="2" fill="url(#accent)"/><text x="24" y="50" font-size="34" font-weight="800" fill="#0F172A">6+</text><text x="24" y="76" font-size="14" fill="#5B6680">Years building software</text></g><g transform="translate(328,96)"><rect width="258" height="96" rx="14" fill="url(#cardg)" stroke="#E3E8F2" filter="url(#sh)"/><rect x="0" y="0" width="4" height="96" rx="2" fill="url(#accent)"/><text x="24" y="50" font-size="34" font-weight="800" fill="#0F172A">3</text><text x="24" y="76" font-size="14" fill="#5B6680">Companies, AI to FinTech</text></g><g transform="translate(608,96)"><rect width="258" height="96" rx="14" fill="url(#cardg)" stroke="#E3E8F2" filter="url(#sh)"/><rect x="0" y="0" width="4" height="96" rx="2" fill="url(#accent)"/><text x="24" y="50" font-size="34" font-weight="800" fill="#0F172A">2</text><text x="24" y="76" font-size="14" fill="#5B6680">CRM platforms automated</text></g><g transform="translate(888,96)"><rect width="258" height="96" rx="14" fill="url(#cardg)" stroke="#E3E8F2" filter="url(#sh)"/><rect x="0" y="0" width="4" height="96" rx="2" fill="url(#accent)"/><text x="24" y="50" font-size="34" font-weight="800" fill="#0F172A">M.Sc.</text><text x="24" y="76" font-size="14" fill="#5B6680">Data Science</text></g></g>
<rect x="0.5" y="0.5" width="1199" height="229" rx="18" fill="none" stroke="#E3E8F2"/>
</svg>
